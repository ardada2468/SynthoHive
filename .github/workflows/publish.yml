name: Publish Python 🐍 distribution to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install CPU-only torch to save massive amount of disk space
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install .[dev] pytest-cov
    - name: Test with pytest
      run: pytest

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install build tooling
      run: python -m pip install build twine
    - name: Verify release tag matches package version
      run: |
        TAG="${{ github.ref_name }}"
        TAG_VERSION="${TAG#v}"
        PKG_VERSION=$(grep -Eo '__version__\s*=\s*"[^"]+"' syntho_hive/__init__.py | grep -Eo '[0-9][^"]*')
        echo "Tag version: ${TAG_VERSION} / Package version: ${PKG_VERSION}"
        if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
          echo "::error::Release tag (${TAG_VERSION}) does not match syntho_hive.__version__ (${PKG_VERSION})"
          exit 1
        fi
    - name: Build a binary wheel and a source tarball
      run: python -m build
    - name: Check distribution metadata
      run: twine check dist/*
    - name: Upload distribution artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - name: Download distribution artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
